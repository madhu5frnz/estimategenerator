[project]
name = "estimateai-backend"
version = "0.1.0"
description = "EstimateAI API: deterministic quantity engine, estimates and BOQ"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "httpx>=0.28",
    "email-validator>=2.2",
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx2>=2.13.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["db: needs a PostgreSQL database (TEST_DATABASE_URL)"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",    # assert is fine in tests
    "RUF001",  # ×, ÷, −, π and ₹ are intentional in engineering text
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"app/ai/rules.py" = ["E501"]  # multilingual lexicon tables read best one entry per line
"app/domain/validation/rules.py" = ["E501"]  # one finding message per line
"tests/**" = ["S", "E501"]
"tools/ts_sor/parse_*.py" = ["E501"]  # PDF layout patterns read best on one line

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]
