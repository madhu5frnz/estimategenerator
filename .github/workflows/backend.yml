name: backend

on:
  push:
    paths: ["backend/**", "fixtures/**", "frontend/openapi.json", "docs/design/03-database-schema.sql", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "fixtures/**", "frontend/openapi.json", "docs/design/03-database-schema.sql", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: estimateai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/estimateai_test
      # No AI key in CI: AI-dependent tests use the rules/mock providers.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: OpenAPI schema committed for the frontend is up to date
        run: uv run python -m app.openapi_dump | diff -u ../frontend/openapi.json - || (echo "Run: cd backend && uv run python -m app.openapi_dump > ../frontend/openapi.json" && exit 1)
      - run: uv run pytest --cov=app --cov-report=term-missing
      - name: Domain coverage gate (95 %)
        run: uv run pytest tests/unit --cov=app/domain --cov-fail-under=95 -q
